readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bw-timex==1.4.0",
    "bw-graph-tools @ git+https://github.com/brightway-lca/bw_graph_tools.git@fix/pardiso-single-activity-technosphere",
    "premise==2.5.1",
    "pypardiso==0.4.6; sys_platform != 'darwin'",
    "scikit-umfpack; sys_platform == 'darwin' and platform_machine == 'arm64'",
]