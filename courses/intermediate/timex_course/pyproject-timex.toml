[project]
name = "timex_course"
version = "0.1.0"
description = "BrightCon 2026 Intermediate Course on time-explicit LCA with bw_timex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # tracks main: the released 1.3.2 predates the timeline/waterfall/solver changes the
    # course material relies on. Pin a version once the next release is out.
    "bw-timex @ git+https://github.com/brightway-lca/bw_timex.git@main",
    "premise==2.5.1",
    "pypardiso==0.4.6; sys_platform != 'darwin'",
    "scikit-umfpack; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
