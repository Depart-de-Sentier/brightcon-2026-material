[project]
name = "timex_course"
version = "0.1.0"
description = "BrightCon 2026 Intermediate Course on time-explicit LCA with bw_timex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bw-timex==1.3.1",
    "scikit-umfpack; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pypardiso; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "premise>=2.5.2",
]
