# display-name: jacobi-gmres

[project]
name = "brightcon-2026-jacobi-gmres"
version = "0.1.0"
description = "Notebook demo of Jacobi-preconditioned GMRES for large Brightway systems"
requires-python = ">=3.14,<3.15"
dependencies = [
  "bw2calc>=2.5.0",
  "bw2data==4.7",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "nbformat>=5.10,<6",
  "numpy==2.5.1",
  "pandas>=3.0.5,<4",
  "psutil>=6,<8",
  "scikit-umfpack==0.4.2",
  "scipy==1.18.0",
]

[tool.uv]
package = false

[project.optional-dependencies]
pardiso = ["pypardiso>=0.4,<1"]
