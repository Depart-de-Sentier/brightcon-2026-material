# For running the notebook locally with conda (the JupyterHub uses requirements-bonsai-edges.txt):
# conda env create -f conda-environment.yml && conda activate brightcon-edges
# Brightway and edges come from pip: conda-forge lacks bw2calc 2.5 and the bw2io IO importer.
name: brightcon-edges
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git                 # for the bw2io install below
  - numpy<2.4
  - pandas
  - scipy
  - matplotlib
  - plotly
  - openpyxl
  - jupyterlab
  - pypardiso           # Intel/AMD only: delete this line on Apple silicon
  - pip:
      - edges==1.4.1
      - bw2data==4.7
      - bw2calc==2.5.0
      - bw2io @ git+https://github.com/mfastudillo/brightway2-io.git@cc72fd1290520f8bc4d5e1a7abadbb6f0eed575f
      - country_converter>=1.3.1
variables:
  PYTHONNOUSERSITE: "1"
