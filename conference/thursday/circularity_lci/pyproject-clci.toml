[project]
name = "clci"
version = "0.1.0"
description = "Brightcon 2026 Thursday talk — Circularity LCI with brightway"
requires-python = ">=3.12"
dependencies = [
    "circularitylci==1.0.0",
    "bw2data==4.7",
    "bw2calc==2.4.0",
    "bw2io==0.9.17",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "mplcursors==0.7",
    "ipympl==0.10.0",
    "scipy==1.18.0",
]

[tool.environ]
display-name = "Circularity LCI BC26"